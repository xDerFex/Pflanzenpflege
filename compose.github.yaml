services:
  pflanzenpflege:
    image: ghcr.io/xderfex/pflanzenpflege-web:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      INVITE_CODE: ${INVITE_CODE:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - pflanzenpflege_data:/data
volumes:
  pflanzenpflege_data:
